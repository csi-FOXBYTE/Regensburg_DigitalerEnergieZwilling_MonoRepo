packages:
- apps/*
- packages/*
allowBuilds:
  esbuild: true
  sharp: true
  protobufjs: true
  es5-ext: true
  unrs-resolver: true
  msw: true
  better-sqlite3: true
  msgpackr-extract: true
  '@prisma/engines': false
  prisma: false
minimumReleaseAgeExclude:
- '@csi-foxbyte/*'
overrides:
  '@types/react': 19.2.17
  '@types/react-dom': 19.2.3
  # @mdxeditor/editor 3.x, orval and @hey-api pin js-yaml 4.1.1 exactly;
  # 4.3.2 fixes the merge-key DoS advisories (F-STAT-019).
  'js-yaml@>=4.0.0 <4.3.2': ^4.3.2
