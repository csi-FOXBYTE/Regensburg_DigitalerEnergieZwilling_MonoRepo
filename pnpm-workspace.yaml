packages:
- apps/*
- packages/*
allowBuilds:
  esbuild: true
  sharp: true
  protobufjs: true
  es5-ext: true
  unrs-resolver: true
  msw: true
  better-sqlite3: true
  msgpackr-extract: true
  '@prisma/engines': false
  prisma: false
minimumReleaseAgeExclude:
- '@csi-foxbyte/*'
overrides:
  '@types/react': 19.2.17
  '@types/react-dom': 19.2.3
