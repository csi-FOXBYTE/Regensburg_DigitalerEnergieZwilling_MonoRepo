packages:
- apps/*
- packages/*
allowBuilds:
  esbuild: true
  sharp: true
  protobufjs: true
  es5-ext: true
  unrs-resolver: true
  msw: true
  better-sqlite3: true
  msgpackr-extract: true
  '@prisma/engines': false
  prisma: false
minimumReleaseAgeExclude:
- '@csi-foxbyte/*'
overrides:
  '@types/react': 19.2.17
  '@types/react-dom': 19.2.3
  # @mdxeditor/editor 3.x, orval and @hey-api pin js-yaml 4.1.1 exactly;
  # 4.3.2 fixes the merge-key DoS advisories (F-STAT-019).
  'js-yaml@>=4.0.0 <4.3.2': ^4.3.2
  # fastify-toab 0.2 pins @bull-board/fastify 6 and @fastify/swagger-ui 5, which
  # need @fastify/static 8 or 9; 10.1.2 fixes the route guard bypasses. Neither
  # uses setHeaders, the one breaking change in 10.
  '@fastify/static@<10.1.2': ^10.1.8
  # @prisma/config 6 (zenstack migrate) pins deepmerge-ts 7.1.5 exactly; 8 fixes
  # the recursion DoS and only changes Map merging, which the config does not use.
  'deepmerge-ts@<8.0.0': ^8.0.2
  # chevrotain (langium, zenstack) pins lodash-es 4.17.21 exactly.
  'lodash-es@<4.17.24': ^4.18.1
  # @boundaries/elements 1.x (eslint-plugin-boundaries 5) pins handlebars 4.7.8.
  'handlebars@<4.7.10': ^4.7.10
