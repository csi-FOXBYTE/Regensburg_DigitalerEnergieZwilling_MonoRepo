name: Check workspace
description: Frozen install, generated prerequisites, type checks and tests.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
    - shell: bash
      run: pnpm check
