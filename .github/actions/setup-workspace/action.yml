name: Set up workspace
description: pnpm and Node from the pinned versions, optionally a frozen install.
inputs:
  install:
    required: false
    default: "true"
    description: Run pnpm install --frozen-lockfile
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: .node-version
        # The pnpm store is only worth restoring for an install.
        cache: ${{ inputs.install == 'true' && 'pnpm' || '' }}
    - if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
