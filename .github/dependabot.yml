version: 2
updates:
  # Actions are pinned to commit SHAs; Dependabot raises the SHA and the
  # version comment together.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
  # Scanner images, pinned by digest in .github/scanners/Dockerfile.
  - package-ecosystem: docker
    directory: "/.github/scanners"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      scanners:
        patterns: ["*"]
