name: Release Regensburg web
run-name: Release Regensburg web

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment (ignored while the current release is 0.1.0)
        type: choice
        required: true
        options: [patch, minor, major]

# Every job declares the permissions it needs.
permissions: {}

# Publication is serialized, including recovery of a partially published release.
concurrency:
  group: release-regensburg-web
  cancel-in-progress: false

env:
  RELEASE_DIR: .local/release-work

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reading draft publication journals requires write access.
    permissions:
      contents: write
      packages: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Test release logic
        run: node --test scripts/release/*.test.mjs scripts/deploy/*.test.mjs
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Select source, fingerprints and images
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUMP: ${{ inputs.bump }}
        run: node scripts/release/plan.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-plan
          path: ${{ env.RELEASE_DIR }}/plan.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  checks:
    name: Check workspace
    needs: plan
    if: needs.plan.outputs.mode == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/check

  images:
    name: Build ${{ matrix.component }}
    permissions:
      contents: read
      packages: write
    needs: [plan, checks]
    if: needs.plan.outputs.mode == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-plan
          path: ${{ env.RELEASE_DIR }}
      - name: Export the fingerprinted build context
        env:
          COMPONENT: ${{ matrix.component }}
        run: node scripts/release/context.mjs "$COMPONENT" "$RUNNER_TEMP/regensburg-web-context"
      - uses: ./.github/actions/release-image
        id: image
        with:
          component: ${{ matrix.component }}
          image: ${{ matrix.image }}
          base-image: ${{ matrix.baseImage }}
          runtime-base-image: ${{ matrix.runtimeBaseImage }}
          platform: ${{ matrix.platform }}
          refresh-epoch: ${{ matrix.refreshEpoch }}
          context: ${{ runner.temp }}/regensburg-web-context/${{ matrix.contextPath }}
          dockerfile: ${{ matrix.dockerfile }}
          username: ${{ github.actor }}
          token: ${{ github.token }}
      - name: Verify and record pushed image
        env:
          COMPONENT: ${{ matrix.component }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/release/record-image.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-image-${{ matrix.component }}
          path: ${{ env.RELEASE_DIR }}/images/${{ matrix.component }}.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  publish:
    name: Publish application release
    needs: [plan, checks, images]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (needs.plan.outputs.mode == 'resume' ||
       (needs.plan.outputs.mode == 'build' && needs.checks.result == 'success' && needs.images.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.54.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-plan
          path: ${{ env.RELEASE_DIR }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.plan.outputs.mode == 'build'
        with:
          pattern: release-image-*
          path: ${{ env.RELEASE_DIR }}/images
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Generate fresh SBOMs for the entire release selection
        env:
          SBOM_DIR: .local/release-sboms
        run: node scripts/release/generate-sboms.mjs "$SBOM_DIR" "$RELEASE_DIR/plan.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-sboms
          path: |
            .local/release-sboms/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
      - name: Tag images, commit manifest, tag Git and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SBOM_DIR: .local/release-sboms
        run: node scripts/release/publish.mjs
