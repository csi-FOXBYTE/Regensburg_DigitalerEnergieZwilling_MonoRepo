name: Release Regensburg web
run-name: Release Regensburg web

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment (ignored while the current release is 0.1.0)
        type: choice
        required: true
        options: [patch, minor, major]

# Every job declares the permissions it needs.
permissions: {}

# Publication is serialized, including recovery of a partially published release.
concurrency:
  group: release-regensburg-web
  cancel-in-progress: false

env:
  RELEASE_DIR: .local/release-work

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reading draft publication journals requires write access.
    permissions:
      contents: write
      packages: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Test release logic
        run: node --test scripts/release/*.test.mjs scripts/deploy/*.test.mjs
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Select source, fingerprints and images
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUMP: ${{ inputs.bump }}
        run: node scripts/release/plan.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-plan
          path: ${{ env.RELEASE_DIR }}/plan.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  checks:
    name: Check workspace
    needs: plan
    if: needs.plan.outputs.mode == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/check

  images:
    name: Build ${{ matrix.component }}
    permissions:
      contents: read
      packages: write
    needs: [plan, checks]
    if: needs.plan.outputs.mode == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-plan
          path: ${{ env.RELEASE_DIR }}
      - name: Export the fingerprinted build context
        env:
          COMPONENT: ${{ matrix.component }}
        run: node scripts/release/context.mjs "$COMPONENT" "$RUNNER_TEMP/regensburg-web-context"
      - uses: ./.github/actions/release-image
        id: image
        with:
          component: ${{ matrix.component }}
          image: ${{ matrix.image }}
          base-image: ${{ matrix.baseImage }}
          runtime-base-image: ${{ matrix.runtimeBaseImage }}
          platform: ${{ matrix.platform }}
          refresh-epoch: ${{ matrix.refreshEpoch }}
          context: ${{ runner.temp }}/regensburg-web-context/${{ matrix.contextPath }}
          dockerfile: ${{ matrix.dockerfile }}
          username: ${{ github.actor }}
          token: ${{ github.token }}
      # Gates exactly what ships: the pushed digest built on the planned base images.
      - name: Scan the pushed image for fixable high and critical vulnerabilities and secrets
        env:
          IMAGE_REF: ${{ matrix.image }}@${{ steps.image.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        run: |
          image=$(.github/scanners/image.sh trivy)
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD "$image" \
            image --skip-version-check --image-src remote --platform "$PLATFORM" --scanners vuln,secret \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE_REF"
      - name: Verify and record pushed image
        env:
          COMPONENT: ${{ matrix.component }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/release/record-image.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image-${{ matrix.component }}
          path: ${{ env.RELEASE_DIR }}/images/${{ matrix.component }}.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  publish:
    name: Publish application release
    needs: [plan, checks, images]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (needs.plan.outputs.mode == 'resume' ||
       (needs.plan.outputs.mode == 'build' && needs.checks.result == 'success' && needs.images.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-plan
          path: ${{ env.RELEASE_DIR }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.mode == 'build'
        with:
          pattern: release-image-*
          path: ${{ env.RELEASE_DIR }}/images
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Generate fresh SBOMs for the entire release selection
        env:
          SBOM_DIR: .local/release-sboms
        run: node scripts/release/generate-sboms.mjs "$SBOM_DIR" "$RELEASE_DIR/plan.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-sboms
          path: |
            .local/release-sboms/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
      - name: Tag images, commit manifest, tag Git and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SBOM_DIR: .local/release-sboms
        run: node scripts/release/publish.mjs
