name: Independent core package
on:
  workflow_dispatch:
    inputs:
      publish_test:
        description: Publish a distinct test package without using the existing core package name
        type: boolean
        default: false
# Every job declares the permissions it needs.
permissions: {}
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/check
      - name: Generate a fresh SBOM and pack the independently versioned core
        env:
          PUBLISH_TEST: ${{ inputs.publish_test }}
        run: |
          if [ "$PUBLISH_TEST" = true ]; then
            node scripts/prepare-core-package.mjs --test-package
          else
            node scripts/prepare-core-package.mjs
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: energy-core-package
          path: |
            .local/core-package/*.tgz
            .local/core-package/*.json
            .local/core-package/*.csv
          include-hidden-files: true
      - name: Publish distinct test package
        if: inputs.publish_test
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          node scripts/publish-test-core.mjs
