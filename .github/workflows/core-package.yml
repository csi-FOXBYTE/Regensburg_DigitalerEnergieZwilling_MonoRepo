name: Independent core package
on:
  workflow_dispatch:
    inputs:
      publish_test:
        description: Publish a distinct prototype package (never the production name)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/check
      - name: Generate a fresh SBOM and pack the independently versioned core
        env:
          PUBLISH_TEST: ${{ inputs.publish_test }}
        run: |
          if [ "$PUBLISH_TEST" = true ]; then
            node scripts/prepare-core-package.mjs --prototype
          else
            node scripts/prepare-core-package.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: energy-core-package
          path: |
            .local/core-package/*.tgz
            .local/core-package/*.json
            .local/core-package/*.csv
          include-hidden-files: true
      - name: Publish distinct test package
        if: inputs.publish_test
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          node scripts/publish-test-core.mjs
