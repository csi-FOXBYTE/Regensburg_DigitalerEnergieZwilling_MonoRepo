name: Workspace CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# Every job declares the permissions it needs.
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  # Scanner images are pinned by digest; the versions match the pentest
  # baseline (SUP-02/03/04/06).
  SEMGREP_IMAGE: semgrep/semgrep:1.130.0@sha256:7674a72a8bd5beaa4591b728e5950c04c58b27b82803901f36e7f9d70b828906
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
  TRIVY_IMAGE: aquasec/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436
jobs:
  check:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm prepare:workspace
      - run: pnpm -r run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm build

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          install: "false"
      - name: Runtime dependencies, high and critical
        run: pnpm audit --prod --audit-level high
      - name: All dependencies including build tools, critical
        if: ${{ !cancelled() }}
        run: pnpm audit --audit-level critical

  semgrep:
    name: Static analysis (semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Scan tracked files
        run: >-
          docker run --rm -e SEMGREP_ENABLE_VERSION_CHECK=0
          -v "$GITHUB_WORKSPACE:/src:ro" -w /src "$SEMGREP_IMAGE"
          sh -c "git config --global --add safe.directory /src &&
          semgrep scan --metrics=off --error --severity WARNING --severity ERROR
          --config p/typescript --config p/javascript --config p/nodejs
          --config p/secrets --config p/dockerfile --config p/github-actions
          --config p/owasp-top-ten"

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the history
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" "$GITLEAKS_IMAGE"
          git --redact --no-banner --config /repo/.gitleaks.toml /repo

  image-scan:
    name: Image scan (trivy) ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        component: [frontend, adminfrontend, backend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build the runtime image
        env:
          COMPONENT: ${{ matrix.component }}
        run: docker build -f "apps/$COMPONENT/Dockerfile" -t "ci/$COMPONENT:scan" .
      - name: Scan for fixable high and critical vulnerabilities and secrets
        env:
          COMPONENT: ${{ matrix.component }}
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE"
          image --skip-version-check --image-src docker --scanners vuln,secret
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "ci/$COMPONENT:scan"
