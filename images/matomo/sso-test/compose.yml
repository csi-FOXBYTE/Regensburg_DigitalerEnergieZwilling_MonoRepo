# Throwaway Matomo and Keycloak for testing the Keycloak login of this image.
# Own Compose project, so it never touches the devcontainer. Not for
# production. Start with ./sso-test.sh up (see README.md in this directory).
name: matomo-sso-test

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # The browser and Matomo both reach Keycloak as http://keycloak:8092, so
      # the token issuer matches on both sides (needs the hosts entry).
      KC_HOSTNAME: http://keycloak:8092
      KC_HTTP_PORT: '8092'
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '127.0.0.1:8092:8092'
    volumes:
      - ./realm-dez.json:/opt/keycloak/data/import/realm-dez.json:ro
    healthcheck:
      # The image has no curl; bash talks to the management port directly.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/localhost/9000; printf "GET /health/ready HTTP/1.0\r\n\r\n" >&3; read -r status <&3; [[ $$status == *" 200"* ]]'
      interval: 3s
      retries: 60

  matomo-db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: matomo
      MARIADB_USER: matomo
      MARIADB_PASSWORD: matomo
    volumes:
      - matomo-db:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 3s
      retries: 40

  matomo:
    build: ..
    environment:
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_TABLES_PREFIX: matomo_
      MATOMO_DATABASE_USERNAME: matomo
      MATOMO_DATABASE_PASSWORD: matomo
      MATOMO_DATABASE_DBNAME: matomo
      # Reached as localhost:8093 from the browser and as http://matomo from
      # the installer.
      MATOMO_DISABLE_TRUSTED_HOST_CHECK: '1'
      MATOMO_OIDC_ISSUER: ${MATOMO_OIDC_ISSUER-http://keycloak:8092/realms/dez}
      MATOMO_OIDC_CLIENT_ID: ${MATOMO_OIDC_CLIENT_ID-matomo}
      MATOMO_OIDC_CLIENT_SECRET_FILE: /run/secrets/matomo-client-secret
    ports:
      - '127.0.0.1:8093:80'
    volumes:
      - matomo-data:/var/www/html
      - ./client-secret.txt:/run/secrets/matomo-client-secret:ro
    depends_on:
      matomo-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'php',
          '-r',
          "exit(@file_get_contents('http://localhost/matomo.php') === false ? 1 : 0);",
        ]
      interval: 3s
      retries: 40

  # Runs install.spec.ts from the frontend's Matomo harness: ./sso-test.sh up
  playwright:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    profiles: [tools]
    ipc: host
    entrypoint: ['bash', '/harness/run-playwright.sh']
    environment:
      NPM_CONFIG_UPDATE_NOTIFIER: 'false'
    volumes:
      - ../../../apps/frontend/tests/matomo:/harness:ro
      - playwright-modules:/runner/node_modules
      - ./results:/results

volumes:
  matomo-db:
  matomo-data:
  playwright-modules:
