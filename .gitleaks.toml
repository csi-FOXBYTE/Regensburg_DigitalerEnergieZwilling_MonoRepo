# gitleaks configuration for the CI secret scan (SUP-04).
[extend]
useDefault = true

# Extends the default generic-api-key rule: identifiers such as
# key: "low_temperature_boiler_..." in these files are false positives
# (F-STAT-034). Every other rule still scans them.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Reviewed generic-api-key false positives (F-STAT-034)"
paths = [
  '''^packages/energy-core/src/types/config/default-config\.ts$''',
  '''^packages/energy-core/src/.*/resolvers/(electrical|thermal)Energy\.ts$''',
  '''^apps/backend/docs/architecture/raw/c4-structurizr\.dsl$''',
]

[allowlist]
description = "nanoid's documentation example, used as a legacy deletion token in tests"
regexes = ['''V1StGXR8_Z5jdHi6B-myT''']
