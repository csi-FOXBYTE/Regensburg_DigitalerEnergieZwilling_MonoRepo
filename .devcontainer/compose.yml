name: regensburg-web
services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    user: "1000:1000"
    init: true
    volumes:
      - ..:/workspace
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:4321:4321"
      - "127.0.0.1:5173:5173"
      - "127.0.0.1:5001:5000"
    environment:
      PACKAGE_TOKEN: ${PACKAGE_TOKEN:-}
      NODE_ENV: development
      HOSTNAME: 0.0.0.0
      PORT: "5000"
      DATABASE_URL: postgresql://regensburg:regensburg@postgres:5432/regensburg
      APP_BASE_URL: http://localhost:5000
      PUBLIC_CLIENT_BASE_URL: http://localhost:4321
      ADMIN_CLIENT_BASE_URL: http://localhost:5173
      KEYCLOAK_JWKS_URI: http://placeholder/not-used-in-development
      REDIS_HOST: redis
      VITE_API_BASE_URL: http://localhost:5000
      # Local Matomo below; the browser on the host sends the events there.
      MATOMO_URL: http://localhost:8091/matomo.php
      MATOMO_SITE_ID: "1"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: regensburg
      POSTGRES_PASSWORD: regensburg
      POSTGRES_DB: regensburg
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regensburg -d regensburg"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
  apisix:
    build:
      context: ..
      dockerfile: .devcontainer/apisix.Dockerfile
    environment:
      APISIX_STAND_ALONE: "true"
    ports:
      - "127.0.0.1:5000:9080"
    depends_on: [dev]
  # Local web analytics (admin / admin-Passw0rd!), installed by matomo-setup.
  matomo-db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: matomo
      MARIADB_USER: matomo
      MARIADB_PASSWORD: matomo
    volumes:
      - matomo_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 40
  matomo:
    image: matomo:5.14.0-apache
    # Installs the local settings next to the config the installer writes.
    entrypoint:
      - bash
      - -c
      - mkdir -p config && cp /matomo-dev/common.config.ini.php config/ && exec /entrypoint.sh apache2-foreground
    environment:
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_TABLES_PREFIX: matomo_
      MATOMO_DATABASE_USERNAME: matomo
      MATOMO_DATABASE_PASSWORD: matomo
      MATOMO_DATABASE_DBNAME: matomo
    ports:
      - "127.0.0.1:8091:80"
    volumes:
      - matomo_data:/var/www/html
      - ./matomo:/matomo-dev:ro
    depends_on:
      matomo-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@file_get_contents('http://localhost/matomo.php') === false ? 1 : 0);"
      interval: 3s
      retries: 40
  # Installs Matomo on first start (skipped later), applies the privacy
  # configuration and exits. Same specs as apps/frontend/tests/matomo.
  matomo-setup:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    ipc: host
    entrypoint:
      - bash
      - -c
      - bash /harness/run-playwright.sh install.spec.ts && cd /runner && npx playwright test configure.spec.ts
    environment:
      SITE_URL: localhost:4321
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    volumes:
      - ../apps/frontend/tests/matomo:/harness:ro
      - matomo_setup_modules:/runner/node_modules
    depends_on:
      matomo:
        condition: service_healthy
volumes:
  postgres_data:
  matomo_db:
  matomo_data:
  matomo_setup_modules:
