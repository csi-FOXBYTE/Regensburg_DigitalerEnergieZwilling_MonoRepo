name: regensburg-web
services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    user: "1000:1000"
    init: true
    volumes:
      - ..:/workspace
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:4321:4321"
      - "127.0.0.1:5173:5173"
      - "127.0.0.1:5001:5000"
    environment:
      PACKAGE_TOKEN: ${PACKAGE_TOKEN:-}
      NODE_ENV: development
      SMTP_URL: smtp://mailpit:1025
      HOSTNAME: 0.0.0.0
      PORT: "5000"
      DATABASE_URL: postgresql://regensburg:regensburg@postgres:5432/regensburg
      APP_BASE_URL: http://localhost:5000
      PUBLIC_CLIENT_BASE_URL: http://localhost:4321
      ADMIN_CLIENT_BASE_URL: http://localhost:5173
      KEYCLOAK_JWKS_URI: http://placeholder/not-used-in-development
      REDIS_HOST: redis
      VITE_API_BASE_URL: http://localhost:5000
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: regensburg
      POSTGRES_PASSWORD: regensburg
      POSTGRES_DB: regensburg
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regensburg -d regensburg"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data
  apisix:
    build:
      context: ..
      dockerfile: .devcontainer/apisix.Dockerfile
    environment:
      APISIX_STAND_ALONE: "true"
    ports:
      - "127.0.0.1:5000:9080"
    depends_on: [dev]
volumes:
  postgres_data:
  mailpit_data:
