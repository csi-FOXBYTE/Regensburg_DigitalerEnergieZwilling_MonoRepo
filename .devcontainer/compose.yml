name: regensburg-web
services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    user: "1000:1000"
    init: true
    volumes:
      - ..:/workspace
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:4321:4321"
      - "127.0.0.1:5173:5173"
      - "127.0.0.1:5001:5000"
    environment:
      PACKAGE_TOKEN: ${PACKAGE_TOKEN:-}
      NODE_ENV: development
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: noreply@example.invalid
      FEEDBACK_MAIL_TO: feedback@example.invalid
      HOSTNAME: 0.0.0.0
      PORT: "5000"
      DATABASE_URL: postgresql://regensburg:regensburg@postgres:5432/regensburg
      APP_BASE_URL: http://localhost:5000
      PUBLIC_CLIENT_BASE_URL: http://localhost:4321
      ADMIN_CLIENT_BASE_URL: http://localhost:5173
      # Dev tokens (pnpm jwt:dev) are HS256 and only decoded; the Keycloak
      # values below are required placeholders and unused in this mode.
      AUTH_INSECURE_DEV_DECODE: "true"
      KEYCLOAK_JWKS_URI: https://placeholder.invalid/not-used-in-development
      KEYCLOAK_ISSUER: https://placeholder.invalid/realms/dev
      AUTH_EXPECTED_AUDIENCE: digital-energy-twin
      REDIS_HOST: redis
      VITE_API_BASE_URL: http://localhost:5000
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: regensburg
      POSTGRES_PASSWORD: regensburg
      POSTGRES_DB: regensburg
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regensburg -d regensburg"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data
  apisix:
    build:
      context: ..
      dockerfile: .devcontainer/apisix.Dockerfile
    environment:
      APISIX_STAND_ALONE: "true"
    ports:
      - "127.0.0.1:5000:9080"
    depends_on: [dev]
  # Optional local web analytics (admin / admin-Passw0rd!), installed by
  # matomo-setup. Only started with --profile matomo, see README.md.
  matomo-db:
    image: mariadb:11
    profiles: [matomo]
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: matomo
      MARIADB_USER: matomo
      MARIADB_PASSWORD: matomo
    volumes:
      - matomo_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 40
      start_period: 5m
  matomo:
    # The official base image of the deployment add-on's Matomo image, which
    # behaves exactly like it without MATOMO_OIDC_* variables.
    image: matomo:5.14.0-apache@sha256:1e00192627025a9eb9108858a0d2fcedb495958adf8ee12cd2b2e4ec306efae4
    profiles: [matomo]
    environment:
      # Matomo is reached as localhost:8091 from the browser and as
      # http://matomo from the setup container. No MATOMO_OIDC_* variables:
      # password login only.
      MATOMO_DISABLE_TRUSTED_HOST_CHECK: "1"
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_TABLES_PREFIX: matomo_
      MATOMO_DATABASE_USERNAME: matomo
      MATOMO_DATABASE_PASSWORD: matomo
      MATOMO_DATABASE_DBNAME: matomo
    ports:
      - "127.0.0.1:8091:80"
    volumes:
      - matomo_data:/var/www/html
    depends_on:
      matomo-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@file_get_contents('http://localhost/matomo.php') === false ? 1 : 0);"
      interval: 3s
      retries: 40
      start_period: 5m
  # Installs Matomo on first start (skipped later), applies the privacy
  # configuration and exits. Same specs as apps/frontend/tests/matomo.
  matomo-setup:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    profiles: [matomo]
    ipc: host
    entrypoint:
      - bash
      - -c
      - bash /harness/run-playwright.sh install.spec.ts && cd /runner && npx playwright test configure.spec.ts
    environment:
      SITE_URL: localhost:4321
      # Unlike the test instance: this one disables the visits log.
      MATOMO_COMPLIANCE_POLICY: cnil_v1
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    volumes:
      - ../apps/frontend/tests/matomo:/harness:ro
      - matomo_setup_modules:/runner/node_modules
    depends_on:
      matomo:
        condition: service_healthy
volumes:
  postgres_data:
  mailpit_data:
  matomo_db:
  matomo_data:
  matomo_setup_modules:
