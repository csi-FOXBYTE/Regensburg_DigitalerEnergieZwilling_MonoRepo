name: rg-web-prototype
services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    user: "1000:1000"
    init: true
    volumes:
      - ..:/workspace
    ports:
      - "127.0.0.1:14321:4321"
      - "127.0.0.1:15173:5173"
      - "127.0.0.1:15001:5000"
    environment:
      PACKAGE_TOKEN: ${PACKAGE_TOKEN:-}
      NODE_ENV: development
      HOSTNAME: 0.0.0.0
      PORT: "5000"
      DATABASE_URL: postgresql://prototype:prototype@postgres:5432/prototype
      APP_BASE_URL: http://localhost:15000
      PUBLIC_CLIENT_BASE_URL: http://localhost:14321
      ADMIN_CLIENT_BASE_URL: http://localhost:15173
      KEYCLOAK_JWKS_URI: http://placeholder/not-used-in-development
      TILES_URL: https://example.invalid/tiles
      TERRAIN_URL: https://example.invalid/terrain
      ADDRESS_DATABASE_URL: https://example.invalid/addresses.sqlite
      REDIS_HOST: redis
      VITE_API_BASE_URL: http://localhost:15000
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prototype
      POSTGRES_PASSWORD: prototype
      POSTGRES_DB: prototype
    volumes:
      - prototype_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prototype -d prototype"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
  apisix:
    build:
      context: ..
      dockerfile: .devcontainer/apisix.Dockerfile
    environment:
      APISIX_STAND_ALONE: "true"
    ports:
      - "127.0.0.1:15000:9080"
    depends_on: [dev]
volumes:
  prototype_postgres:
